{% extends "base.html" %}
{% block title %}Add Vault Item{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0">Add Vault Item</h3>

    <a href="{{ url_for('dashboard') }}"
       class="btn btn-outline-secondary">
        ← Back to Dashboard
    </a>
</div>
<div class="card shadow-sm p-4">

  <form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
    <label class="form-label">
        Title
        <small class="text-muted fw-normal ms-2">
            Please provide either Text or File (or both).
        </small>
    </label>

    <input
        type="text"
        name="title"
        class="form-control"
        required
    >
</div>

    <div class="mb-3">
      <label class="form-label">Text Content</label>
      <textarea name="content" class="form-control" rows="5" placeholder="Enter text content here"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Upload File</label>
      <input type="file" name="file" class="form-control">
      <small class="text-muted">Allowed: images, pdf, doc, docx, xls, xlsx</small>
    </div>

    <div class="form-check mb-3">
      <input
      class="form-check-input"
      type="checkbox"
      name="release_enabled"
      id="release_enabled"
      >
      <label class="form-check-label" for="release_enabled">
      Release this item if the Dead Man's Switch is triggered
      </label>
    </div>
    <button type="submit" class="btn btn-dark">Save Vault Item</button>
  </form>
</div>
{% endblock %}
