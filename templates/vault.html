{% extends "base.html" %}
{% block content %}
<h3>Vault Data</h3>
<form method="post" class="card card-body mb-4">
  <input class="form-control mb-3" name="title" placeholder="Title" required>
  <textarea class="form-control mb-3" name="content" placeholder="Content" rows="4" required></textarea>
  <button class="btn btn-primary">Save</button>
</form>

<table class="table table-bordered">
  <thead>
    <tr>
      <th>Title</th>
      <th>Content</th>
      <th>Created</th>
    </tr>
  </thead>
  <tbody>
    {% for row in data %}
    <tr>
      <td>{{ row.title }}</td>
      <td>{{ row.content }}</td>
      <td>{{ row.created_at }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
