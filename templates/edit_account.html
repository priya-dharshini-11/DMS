{% extends "base.html" %}

{% block title %}Edit Account{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h3 class="mb-1">Edit Account</h3>
        <p class="text-muted mb-0">
            Update your account details.
        </p>
    </div>

    <a
        href="{{ url_for('account') }}"
        class="btn btn-outline-secondary"
    >
        ← Back to Account
    </a>

</div>


<div class="card shadow-sm">

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ user.name }}"
                    maxlength="100"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    value="{{ user.email }}"
                    disabled
                >

                <div class="form-text">
                    Email changes are currently protected because your email
                    is used for verification and account recovery.
                </div>

            </div>


            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-dark"
                >
                    Save Changes
                </button>

                <a
                    href="{{ url_for('account') }}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
