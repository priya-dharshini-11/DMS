{% extends "base.html" %}

{% block content %}

<div class="dms-login-gateway">

    <div class="dms-login-gateway-card">

        <div class="dms-login-gateway-brand">
            <img
                src="{{ url_for('static', filename='Untitled design (1).png') }}"
                alt="DMS Vault"
                class="dms-login-gateway-logo"
            >
        </div>

        <div class="dms-login-gateway-header">

            <p class="dms-auth-eyebrow">
                DMS VAULT
            </p>

            <h1>
                Welcome Back
            </h1>

            <p>
                Choose how you want to access the system.
            </p>

        </div>


        <div class="dms-login-options">

            <a
                href="{{ url_for('login') }}"
                class="dms-login-option dms-login-user"
            >
                <div class="dms-login-option-icon">
                    👤
                </div>

                <div class="dms-login-option-content">
                    <strong>User Login</strong>
                    <span>
                        Access your personal vault and DMS controls.
                    </span>
                </div>

                <span class="dms-login-option-arrow" aria-hidden="true">
                    →
                </span>
            </a>


            <a
                href="{{ url_for('alogin') }}"
                class="dms-login-option dms-login-admin"
            >
                <div class="dms-login-option-icon">
                    🛡️
                </div>

                <div class="dms-login-option-content">
                    <strong>Admin Login</strong>
                    <span>
                        Manage users, releases, support and monitoring.
                    </span>
                </div>

                <span class="dms-login-option-arrow" aria-hidden="true">
                    →
                </span>
            </a>

        </div>


        <div class="dms-login-register">

            <span>New to DMS Vault?</span>

            <a href="{{ url_for('register') }}">
                Create an account
            </a>

        </div>

    </div>

</div>

{% endblock %}
