{% extends "base.html" %}

{% block content %}

<div class="dms-admin-login-page">

    <div class="dms-admin-login-card">

        <div class="dms-admin-login-header">

            <div class="dms-admin-login-icon" aria-hidden="true">
                🔐
            </div>

            <p class="dms-admin-login-eyebrow">
                DMS VAULT · ADMIN
            </p>

            <h1>
                Admin Password Recovery
            </h1>

            <p>
                Enter your admin email address to receive a secure password reset link.
            </p>

        </div>


        <form method="post" class="dms-admin-login-form">

            <div class="dms-admin-login-field">

                <label for="admin-recovery-email">
                    Admin Email Address
                </label>

                <input
                    id="admin-recovery-email"
                    class="form-control"
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-dark dms-admin-login-submit"
            >
                Send Reset Link
            </button>

        </form>


        <div class="dms-admin-login-footer">

            <a href="{{ url_for('alogin') }}">
                ← Back to Admin Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
