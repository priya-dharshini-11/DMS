{% extends "base.html" %}

{% block title %}Edit Vault Item{% endblock %}

{% block content %}

<div class="card shadow-sm p-4">
    <h3 class="mb-4">Edit Vault Item</h3>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Title</label>

            <input
                type="text"
                name="title"
                class="form-control"
                value="{{ item.title }}"
                maxlength="150"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Vault Item Type</label>

            <input
                type="text"
                class="form-control"
                value="{{ item.item_type|capitalize }}"
                disabled
            >
        </div>

        {% if item.item_type == 'file' %}
            <div class="mb-3">
                <label class="form-label">File</label>
                <p class="text-muted mb-0">
                    {{ item.original_file_name or item.file_name }}
                </p>
            </div>
        {% else %}
            <div class="mb-3">
                <label class="form-label">Content</label>

                <textarea
                    class="form-control"
                    rows="5"
                    disabled
                >{{ item.content }}</textarea>
            </div>
        {% endif %}

        <div class="form-check mb-4">
            <input
                class="form-check-input"
                type="checkbox"
                name="release_enabled"
                id="release_enabled"
                {% if item.release_enabled %}checked{% endif %}
            >

            <label class="form-check-label" for="release_enabled">
                Release this item if the Dead Man's Switch is triggered
            </label>
        </div>

        <div>
            <button type="submit" class="btn btn-dark">
                Save Changes
            </button>

            <a
                href="{{ url_for('view_vault') }}"
                class="btn btn-outline-secondary"
            >
                ← Back to Vault
            </a>
        </div>

    </form>
</div>

{% endblock %}
