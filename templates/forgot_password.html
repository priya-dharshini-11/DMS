{% extends "base.html" %}

{% block content %}

<div class="dms-login-page">

    <div class="dms-login-card">

        <div class="dms-login-header">

            <div class="dms-login-icon" aria-hidden="true">
                🔑
            </div>

            <p class="dms-login-eyebrow">
                DMS VAULT
            </p>

            <h1>
                Forgot Password
            </h1>

            <p>
                Enter your email and we'll send you a secure reset link.
            </p>

        </div>


        <form method="post" class="dms-login-form">

            <div class="dms-login-field">

                <label for="forgot-email">
                    Email Address
                </label>

                <input
                    id="forgot-email"
                    class="form-control"
                    type="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-dark dms-login-submit"
            >
                Send Reset Link
            </button>

        </form>


        <div class="dms-login-footer">

            <span>Remember your password?</span>

            <a href="{{ url_for('log') }}">
                Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
