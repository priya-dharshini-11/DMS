{% extends "base.html" %}

{% block content %}

<div class="dms-login-page">

    <div class="dms-login-card">

        <div class="dms-login-header">

            <div class="dms-login-icon" aria-hidden="true">
                🔑
            </div>

            <p class="dms-login-eyebrow">
                DMS VAULT
            </p>

            <h1>
                Reset Password
            </h1>

            <p>
                Create a new password for your secure account.
            </p>

        </div>


        <form method="post" class="dms-login-form">

            <div class="dms-login-field">

                <label for="reset-password">
                    New Password
                </label>

                <div class="dms-password-input">

                    <input
                        id="reset-password"
                        class="form-control"
                        type="password"
                        name="password"
                        placeholder="Enter your new password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="dms-password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <svg
                            class="dms-eye-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="2.5"/>
                        </svg>
                    </button>

                </div>

            </div>


            <div class="dms-login-field">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <div class="dms-password-input">

                    <input
                        id="confirm-password"
                        class="form-control"
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm your new password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="dms-password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <svg
                            class="dms-eye-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="2.5"/>
                        </svg>
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="btn btn-dark dms-login-submit"
            >
                Reset Password
            </button>

        </form>


        <div class="dms-login-footer">

            <span>Remember your password?</span>

            <a href="{{ url_for('log') }}">
                Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
