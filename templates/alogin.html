{% extends "base.html" %}
{% block content %}
<h3>Admin Login</h3>
<form method="post" class="card card-body">
  <input class="form-control mb-3" type="email" name="email" placeholder="Admin Email" required>
  <input class="form-control mb-3" type="password" name="password" placeholder="Admin Password" required>
  <button class="btn btn-dark">Login as Admin</button>
</form>
{% endblock %}
