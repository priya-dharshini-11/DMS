{% extends "base.html" %}

{% block content %}

<div class="dms-login-page">

    <div class="dms-login-card">

        <div class="dms-login-header">

            <div class="dms-login-icon" aria-hidden="true">
                ⏳
            </div>

            <p class="dms-login-eyebrow">
                DMS VAULT
            </p>

            <h1>
                Check-in Link Expired
            </h1>

            <p>
                This check-in link is no longer valid.
            </p>

        </div>


        <div class="text-center">

            <p class="text-muted mb-4">
                The link may have expired or already been used.
                You can still confirm that you're active by logging in to your DMS account.
            </p>


            <a
                href="{{ url_for('log') }}"
                class="btn btn-dark dms-login-submit"
            >
                Login to DMS
            </a>

        </div>

    </div>

</div>

{% endblock %}
