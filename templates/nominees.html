{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">

    <h3 class="mb-0">Nominees</h3>

    <a href="{{ url_for('dashboard') }}"
       class="btn btn-outline-secondary">
        ← Back to Dashboard
    </a>

</div>
<form method="post" class="card card-body mb-4">
  <input class="form-control mb-3" name="name" placeholder="Name" required>
  <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
  <input class="form-control mb-3" name="relation" placeholder="Relation" required>
  <button class="btn btn-primary">Add Nominee</button>
</form>

<table class="table table-bordered">
  <thead>
  <tr>
    <th>Name</th>
    <th>Email</th>
    <th>Relation</th>
    <th>Action</th>
  </tr>
  </thead>
  <tbody>
  {% for row in data %}
  <tr>
    <td>{{ row.name }}</td>
    <td>{{ row.email }}</td>
    <td>{{ row.relation }}</td>
    <td>
    <a href="{{ url_for('edit_nominee', nominee_id=row.id) }}"
    class="btn btn-primary btn-sm">Edit
    </a>

    <form method="post"
        action="{{ url_for('delete_nominee', nominee_id=row.id) }}"
        style="display: inline;"
        onsubmit="return confirm('Are you sure you want to delete this nominee?');">

       <button type="submit" class="btn btn-danger btn-sm">Delete</button>

    </form>
    </td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
