{% extends "base.html" %}

{% block title %}Nominees{% endblock %}

{% block content %}

<div class="dms-page-header mb-4">

    <div class="dms-page-title">
        <h3 class="mb-0">Nominees</h3>
    </div>

    <div class="dms-page-header-actions">

        <a href="{{ url_for('dashboard') }}"
           class="btn btn-outline-secondary">
            ← Back to Dashboard
        </a>

    </div>

</div>


<!-- Add Nominee -->
<form method="post" class="card card-body dms-form-card mb-4 lg-col-6">

    <input
        class="form-control mb-3"
        name="name"
        placeholder="Name"
        required
    >

    <input
        class="form-control mb-3"
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <input
        class="form-control mb-3"
        name="relation"
        placeholder="Relation"
        required
    >

    <button class="btn btn-primary">
        Add Nominee
    </button>

</form>


<!-- Nominee List -->
<div class="dms-nominee-table-wrapper">

    <table class="table table-bordered dms-nominee-table">

        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Relation</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

        {% for row in data %}

        <tr>

            <td data-label="Name">
                {{ row.name }}
            </td>

            <td data-label="Email">
                {{ row.email }}
            </td>

            <td data-label="Relation">
                {{ row.relation }}
            </td>

            <td data-label="Action">

                <div class="dms-nominee-actions">

                    <a
                        href="{{ url_for('edit_nominee', nominee_id=row.id) }}"
                        class="btn btn-primary btn-sm"
                    >
                        Edit
                    </a>

                    <form
                        method="post"
                        action="{{ url_for('delete_nominee', nominee_id=row.id) }}"
                        onsubmit="return confirm('Are you sure you want to delete this nominee?');"
                    >

                        <button
                            type="submit"
                            class="btn btn-danger btn-sm"
                        >
                            Delete
                        </button>

                    </form>

                </div>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
